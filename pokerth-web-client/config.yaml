name: PokerTH Web Client
version: "1.4.3"
slug: pokerth_web_client
description: Official PokerTH web client (PWA) — play from your browser
url: https://github.com/narmod/hassio-addons/tree/main/pokerth-web-client
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web client + admin page (HTTP + WebSocket)
webui: http://[HOST]:[PORT:8080]
ingress: true
ingress_port: 8099
panel_icon: mdi:cards-playing-outline
panel_title: PokerTH
panel_admin: false
hassio_api: true
options:
  admin_token: ""
  admin_enabled: true
  external_port: 0
  git_ref: "main"
  auto_update: false
  allowed_hosts: []
  allowed_ports: []
schema:
  admin_token: "password?"
  admin_enabled: "bool?"
  external_port: "int(0,65535)?"
  git_ref: "str?"
  auto_update: "bool?"
  allowed_hosts:
    - str
  allowed_ports:
    - port
